name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 静态检查先行：vet 能在编译期抓出 printf 参数错配、结构体标签错误、无用赋值等，
      # 成本几乎为零。gofmt 门禁暂不启用——存量 149/185 个文件不符合 gofmt，需单独
      # 一次"仅格式化"提交后再开，否则每个 PR 都会红。
      - run: go vet ./...
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（wb2api-panel-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 取历史 tag 算 compare 链接
          fetch-tags: true    # 显式拉取 tag 对象：Release 标题取自 tag 注解，缺对象会退化成 commit subject
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"   # appVersion 带 -panel 后缀，比对前剥掉
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      # Release 标题/正文不再用硬编码模板：标题取 tag 注解首行（本仓习惯就是
      # 「v1.15.6: 一句话概括」，与历史 Release 标题同款），正文取 CHANGELOG 里
      # 该版本的段落。此前每次发版都要手工 `gh release edit` 一次，漏了就与历史
      # 版本风格不一致（v1.15.6 首版即如此）。两处缺失都只告警不失败——发布线不能
      # 因为文档没写全而卡住。
      - name: 生成 Release 标题与正文
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 发布纪律：Release 标题 = tag 注解首行，且必须形如「vX.Y.Z: 中文摘要」。
          # 坑：runner 侧 `%(contents:subject)` 有时拿到的是 commit subject（v1.15.6 /
          # v1.15.7 均踩过，发出去的标题就是 commit message，须手工 gh release edit 修）。
          # 先判对象类型、再做前缀断言，任一不满足都回落为 tag 名并告警——宁可标题
          # 退化成裸 tag，也不能把 commit message 当标题发布。
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" != "tag" ]; then
            echo "::warning::tag $TAG 在 runner 侧未解析为注解对象，Release 标题回落为 tag 名"
            TITLE="$TAG"
          else
            TITLE=$(git tag -l --format='%(contents:subject)' "$TAG" | head -1)
            case "$TITLE" in
              "$TAG:"*|"$TAG："*) : ;;
              *)
                echo "::warning::Release 标题不合规（应为「$TAG: 中文摘要」，实得「$TITLE」），回落为 tag 名"
                TITLE="$TAG"
                ;;
            esac
          fi

          # 用 index() 定位而非正则：版本号里的方括号/[.] 在 awk 正则里都要转义，
          # ENVIRON 传值可完全避开转义问题。段落 = 版本标题行之后、下一个 "## " 之前。
          BODY=$(VER="$VER" awk '
            !on && index($0, "## [" ENVIRON["VER"]) == 1 { on = 1; next }
            on && index($0, "## ") == 1 { exit }
            on { print }
          ' CHANGELOG.md)
          # 版本标题行后紧跟空行，去掉以免正文以空行开头（Release 渲染无影响，纯粹是好看）。
          BODY=$(printf '%s\n' "$BODY" | sed '/./,$!d')

          if [ -z "$BODY" ]; then
            echo "::warning::CHANGELOG 缺少 [$VER] 段落，Release 正文回落为通用模板"
            BODY="CI 自动构建发布（五平台二进制 + checksums）。"
          fi

          {
            printf '%s\n' "$BODY"
            if [ -n "${{ steps.prev.outputs.prev }}" ]; then
              printf '\n**完整变更**：https://github.com/%s/compare/%s...%s\n' \
                "${{ github.repository }}" "${{ steps.prev.outputs.prev }}" "$TAG"
            fi
          } > release-notes.md

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "---- release-notes.md 前 5 行 ----"
          head -5 release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: dist/*
